<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
  <div class="header">Chat UI</div>

  <div class="messages">
    <div class="msg received">Hi 👋</div>
    <div class="msg sent">Hello! How are you?</div>
    <div class="msg received">I’m good 😊</div>
  </div>

  <div class="input-box">
    <input type="text" placeholder="Type a message">
    <button>Send</button>
  </div>
</div>

</body>
</html>
